# NeurOS agent orchestrator config.

# Name shown in the top pane.
AGENT_NAME="Claude"

# Command run inside the tmux session. The real Claude Code CLI (baked by the
# claude-code package, auth in /root/.claude). Swap back to the mock with:
#   AGENT_CMD="/usr/lib/neuros/mock-agent"
AGENT_CMD="claude"

TMUX_SESSION="agent"

# Working directory the agent CLI starts in (pre-trusted in /root/.claude.json).
AGENT_WORKDIR="/root"

# Shown in the model pill under the agent name.
AGENT_MODEL="Sonnet 5"

# Claude Code environment: no self-update (image is read-only), quiet telemetry.
export DISABLE_AUTOUPDATER=1
export DISABLE_TELEMETRY=1
export DISABLE_ERROR_REPORTING=1
export CLAUDE_CODE_DISABLE_NONESSENTIAL_TRAFFIC=1

# Piper voice model for TTS (empty / missing = silent).
TTS_VOICE="/usr/share/piper-voices/en_US-ryan-medium.onnx"
