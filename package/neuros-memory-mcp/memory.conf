# NeurOS shared memory. The canonical store is the neuros-memory Cloudflare
# Worker; the on-device neuros-memory-mcp is a read-through / write-behind cache.
# MEMORY_MCP_URL empty -> device runs a purely local memory dir (no sync).
MEMORY_MCP_URL="https://neuros-memory.fokus2082.workers.dev/mcp"
# the bearer token lives in /etc/neuros/mcp-token (baked dev-only by post-build,
# or written on the device).
