# NeurOS - the agent runs inside this tmux session; the centre-pane terminal
# (foot) attaches to it. tmux's built-in default is 8-colour "screen", which
# washes out the Claude Code TUI and turns the orange mascot pink. Force a
# 256-colour base + 24-bit passthrough to foot.
set  -g  default-terminal "screen-256color"
set  -ga terminal-overrides ",*:Tc"
set  -as terminal-features ",foot*:RGB"

set  -g  status off
set  -sg escape-time 10
set  -g  history-limit 5000
set  -g  mouse off
