# NeurOS centre-pane terminal - transparent bg so the glass panel shows through.
[main]
font=JetBrains Mono:size=10
pad=16x14
selection-target=none

[csd]
preferred=none

[colors]
alpha=0.16
background=0a0908
foreground=dedbd5
regular0=1a1a1a
regular7=dedbd5
bright0=3a3a3a
bright7=fdfbf8

[cursor]
style=block
blink=yes

[scrollback]
lines=2000
