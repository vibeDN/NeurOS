# NeurOS centre-pane terminal - transparent bg so the glass panel shows through.
[main]
font=JetBrains Mono:size=10
pad=16x14
selection-target=none

[csd]
preferred=none

[colors]
# transparent - the compositor's dark glass panel is the real background
alpha=0.0
background=0a0908
foreground=e4e1db

# 16-colour ANSI palette = kitty's defaults (foot only shipped 0/7 before, so
# reds/greens/blues in the agent TUI were washed out)
regular0=000000
regular1=cc0403
regular2=19cb00
regular3=cecb00
regular4=0d73cc
regular5=cb1ed1
regular6=0dcdcd
regular7=dddddd
bright0=767676
bright1=f2201f
bright2=23fd00
bright3=fffd00
bright4=1a8fff
bright5=fd28ff
bright6=14ffff
bright7=ffffff

[cursor]
style=block
blink=yes
color=0a0908 e4e1db

[scrollback]
lines=2000
